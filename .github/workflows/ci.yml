# Checks every push and pull request: lint, formatting, unit tests and a production build, plus
# the CLI workspace's tests and build.
# The build runs without Supabase settings (the site supports that), so no secrets are needed.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Node version pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The site's unit tests (the CLI's run in their own step below).
      - run: npm test -- --project site
      - run: npm run build

      # The CLI (packages/cli): unit tests, then compile it and run the compiled entry point.
      - run: npm run cli:test
      - run: npm run cli:build
      - run: node packages/cli/dist/cli.js --version
